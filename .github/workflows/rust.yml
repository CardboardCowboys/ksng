on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  UBUNTU_DEPS: libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libfreetype-dev libfontconfig-dev

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Dependencies (Ubuntu)
        run: |
          sudo apt install ${{ env.UBUNTU_DEPS }}
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: sudo apt-get install ${{ env.UBUNTU_DEPS }}
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --lib

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Dependencies (Ubuntu)
        run: |
          sudo apt install ${{ env.UBUNTU_DEPS }}
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          TARGET: aarch64-apple-darwin

        - os: ubuntu-24.04-arm
          TARGET: aarch64-unknown-linux-gnu
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl-shared.tar.xz

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-gnu
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl-shared.tar.xz

        - os: windows-11-arm
          TARGET: aarch64-pc-windows-msvc
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-02-13-13/ffmpeg-n9.0.1-11-ge47273f4d9-winarm64-gpl-shared-9.0.zip
          EXTENSION: .exe

        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-02-13-13/ffmpeg-n9.0.1-11-ge47273f4d9-win64-gpl-shared-9.0.zip
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install Dependencies (Ubuntu)
      if: contains(matrix.TARGET, 'linux')
      run: |
        sudo apt install ${{ env.UBUNTU_DEPS }}
    - name: Install CUDA Toolkit (Ubuntu)
      if: contains(matrix.TARGET, 'linux')
      uses: Jimver/cuda-toolkit@master
      id: cuda-toolkit
    - name: Cache ffmpeg (Ubuntu)
      if: contains(matrix.TARGET, 'linux')
      id: cache-ffmpeg-linux
      uses: actions/cache@v6
      with:
        path: /tmp/ffmpeg
        key: ${{ runner.os }}-ffmpeg
    - name: Install ffmpeg (Ubuntu)
      if: contains(matrix.TARGET, 'linux') && steps.cache-ffmpeg-linux.outputs.cache-hit != 'true'
      run: |
        wget ${{ matrix.FFMPEG_URL }} -O /tmp/ffmpeg.tar.xz
        mkdir /tmp/ffmpeg
        tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
    - name: Set FFMPEG_DIR (Ubuntu)
      if: contains(matrix.TARGET, 'linux')
      run:
        echo "FFMPEG_DIR=/tmp/ffmpeg" >> "$GITHUB_ENV"

    - name: Cache ffmpeg (Windows)
      if: contains(matrix.TARGET, 'windows')
      id: cache-ffmpeg-windows
      uses: actions/cache@v6
      with:
        path: C:/ffmpeg
        key: ${{ runner.os }}-ffmpeg
    - name: Install ffmpeg (Windows)
      shell: pwsh
      if: contains(matrix.TARGET, 'windows') && steps.cache-ffmpeg-windows.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest ${{ matrix.FFMPEG_URL }} -OutFile "$env:Temp\ffmpeg.zip"
        Expand-Archive -Path "$env:Temp\ffmpeg.zip" -DestinationPath C:\ffmpeg
    - name: Set FFMPEG_DIR (Windows)
      shell: pwsh
      if: contains(matrix.TARGET, 'windows')
      run: |
        $path = @(Get-ChildItem -Path C:\ffmpeg)[0]
        $ffmpeg_dir = "C:\ffmpeg\$path"
        echo "FFMPEG_DIR=$ffmpeg_dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$ffmpeg_dir"
        Get-ChildItem $ffmpeg_dir

    - name: Build
      run: |
        cargo build --verbose --release --target=${{ matrix.TARGET }}

    - name: Make Final Zip
      run: |
        mkdir /tmp
        mkdir /tmp/release
        cp target/${{ matrix.TARGET }}/release/ksng${{ matrix.EXTENSION }} "/tmp/release\ksng-${{ matrix.TARGET }}${{ matrix.EXTENSION }}"
        cp target/${{ matrix.TARGET }}/release/*.dll /tmp/release
        cp target/${{ matrix.TARGET }}/release/*.so tmp/release
        cp target/${{ matrix.TARGET }}/release/*.dylib tmp/release

    - uses: actions/upload-artifact@master
      with:
        name: ksng-${{ matrix.TARGET }}
        path: tmp/release
        archive: true
