[package]
name = "spectrasonic"
version = "0.1.0"
edition = "2024"

[dependencies]
circular-buffer = "2.0.1"
infer = "0.22.0"
rubato = "5.0.0"
symphonia = { version = "0.5.4", features = ["mp3", "aac"], optional = true }
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = ["codec", "device", "format", "software-resampling", "software-scaling" ]}
log = "0.4.34"
audioadapter-buffers = "5.2.0"

[features]
default = ["ffmpeg", "symphonia"]
ffmpeg = ["dep:ffmpeg-next"]
symphonia = ["dep:symphonia"]
encoding = []