[package]
name = "ksng-ml"
version = "0.1.0"
edition = "2024"

[dependencies]
klib = { path = "../klib", features = ["audio"] }
anyhow = "1.0.104"
colog = "1.4.0"
directories = "6.0.0"
futures-util = "0.3.34"
interprocess = { version = "2.4.4", features = ["tokio"] }
ksng-ml-ipc = { path = "../ksng-ml-ipc", features = ["tokio"] }
log = "0.4.34"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["ndarray", "load-dynamic", "cuda", "tensorrt", "nvrtx", "directml"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "system-proxy", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
zerocopy = "0.8.57"
spectrasonic = { path = "../spectrasonic", features = ["encoding", "ffmpeg", "encoder-flac"] }
itertools = "0.15.0"
