[package]
name = "klib"
version = "0.1.0"
edition = "2021"

[dependencies]
binary_rw = "4.1.0"
harfbuzz_rs = { version = "2.0.1", default-features = false, features = ["build-native-harfbuzz"] }
klib-macros = { version = "0.1.0", path = "../klib-macros" }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
simple-easing = "1.0.1"
skia-safe = "0.87.0"
sortedlist-rs = "0.2.5"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
zerocopy = "0.8.57"
# dependencies for "audio" feature
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = ["codec", "device", "format", "software-resampling", "software-scaling" ]}
spectrasonic = { path = "../spectrasonic", optional = true }

[features]
default = ["ffmpeg"]
audio = ["dep:spectrasonic"]
symphonia = ["audio", "spectrasonic/symphonia"]
ffmpeg = ["audio", "dep:ffmpeg-next", "spectrasonic/ffmpeg"]
export_video = ["audio", "ffmpeg"]
build-ffmpeg = ["ffmpeg", "ffmpeg-next/build", "ffmpeg-next/build-license-gpl", "ffmpeg-next/build-lib-x264", "ffmpeg-next/build-lib-opus", "ffmpeg-next/build-lib-vpx"]
